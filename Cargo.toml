[package]
name = "code-combo"
version.workspace = true
edition.workspace = true

[[bin]]
name = "coco"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
snafu = "0.8.9"
ctor = "0.5.0"
bon = "3.8.1"
indoc = "2.0.6"
lazy_static = "1.5.0"
time = { version = "0.3.44" }
tempfile = "3.22.0"
tree-sitter = { version = "0.25" }
tree-sitter-md = { version = "0.5.1" }
futures-core = "0.3.31"
futures-util = "0.3.31"
tokio-util = "0.7.16"
clap = { version = "4.5.47", features = ["derive", "string"] }

# Core dependencies for CLI and application functionality
[dependencies]
# External API integration
anthropic = { path = "./crates/anthropic" }

# Datetime utilities
time.workspace = true

# Command line argument parsing
clap.workspace = true

# Serialization and data handling
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml = "0.9.5"

# Error handling
snafu.workspace = true

# Async runtime
tokio.workspace = true
tokio-util.workspace = true
async-trait = "0.1.89"
futures-core.workspace = true
futures-util.workspace = true
rmcp = { version = "0.10", features = [
  "client",
  "reqwest",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
  "transport-child-process",
  "tower",
  "auth",
  "base64",
  "schemars",
  "macros",
] }
schemars = "1.2.0"

# Logging and tracing
tracing.workspace = true
tracing-subscriber.workspace = true

# Other
lazy_static.workspace = true
indoc.workspace = true
similar = "2.7.0"
tempfile.workspace = true
tree-sitter.workspace = true
tree-sitter-bash = "0.25.0"

[dev-dependencies]
ctor.workspace = true
uuid = { version = "1.11.0", features = ["v4"] }
which = "6.0"
hyper = { version = "1.7.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio", "service"] }

[build-dependencies]
time = { workspace = true, features = ["formatting"] }

[patch.crates-io]
tree-sitter-diff = { git = "https://github.com/tree-sitter-grammars/tree-sitter-diff.git", tag = "v0.1.0" }
